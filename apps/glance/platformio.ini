[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = ota_8mb.csv
board_build.filesystem = littlefs

; Default chain mode (same as upstream). The + modes (chain+/deep+) break on
; this platform: their preprocessor evaluation stops FS.h/LittleFS resolution.
lib_ldf_mode = chain
lib_extra_dirs =
    ${PROJECT_DIR}/../../lib
    ${PROJECT_DIR}/../../hal
    ${PROJECT_DIR}/../../vendor

; buddy's deps minus AnimatedGIF — glance composes no faces/GIF player.
lib_deps =
    moononournation/GFX Library for Arduino
    lewisxhe/XPowersLib
    lewisxhe/SensorLib
    adafruit/Adafruit BusIO
    bblanchon/ArduinoJson @ ^7.0.0
    olikraus/U8g2 @ ^2.35
    ricmoo/QRCode @ ^0.0.1

[env:waveshare-esp32c6-touch-amoled-2-16]
board = esp32-c6-devkitc-1
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
board_build.flash_mode = qio
; House rule for this board: 460800 is the proven-reliable rate on this Mac.
upload_speed = 460800
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
; No psram_type, no arduino.memory_type — C6 has no PSRAM.
; No -DBUDDY_BLE_* and no NimBLE dep: glance is a no-BLE composition.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DXPOWERS_CHIP_AXP2101
    -DU8G2_USE_LARGE_FONTS
    -DU8G2_FONT_SUPPORT
    -DBOARD_WAVESHARE_ESP32C6_TOUCH_AMOLED_2_16
lib_ignore =
    Adafruit_XCA9554
    Arduino_DriveBus
    BLE

; Spotpear ESP32-S3-1.54-MUMA: ST7789 240×240 SPI, CST816D touch (absent on
; the non-touch SKU), no PMU/IMU/RTC/expander. 16 MB flash, but the 8 MB OTA
; table fits and keeps NVS where every app expects it.
[env:spotpear-esp32s3-muma-1-54]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
; S3 house rule on this Mac: 115200 only (460800 corrupts, 921600 drops).
upload_speed = 115200
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DXPOWERS_CHIP_AXP2101
    -DU8G2_USE_LARGE_FONTS
    -DU8G2_FONT_SUPPORT
    -DBOARD_SPOTPEAR_ESP32S3_MUMA_1_54
lib_ignore =
    Adafruit_XCA9554
    Arduino_DriveBus
    BLE
